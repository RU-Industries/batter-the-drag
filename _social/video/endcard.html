<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0e; color: #ecebe6; font-family: 'Prompt', sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
  .site { font-weight: 300; font-size: 17px; letter-spacing: .14em; color: #8d8b85; }
  .rule { width: 44px; height: 1px; background: rgba(236,235,230,.3); margin: 30px 0; }
  .by { font-weight: 300; font-size: 19px; color: #c9c7c0; }
  .name { font-weight: 500; font-size: 50px; line-height: 1.1; margin-top: 8px; letter-spacing: -.01em; }
  .url { font-weight: 300; font-size: 22px; margin-top: 14px; color: #ecebe6; letter-spacing: .04em; }
</style></head>
<body><div class="wrap">
  <p class="site">batterthedrag.com</p>
  <div class="rule"></div>
  <p class="by">Website designed &amp; built by</p>
  <p class="name">Jeff Ruoss</p>
  <p class="url">jeffruoss.com</p>
</div></body></html>
