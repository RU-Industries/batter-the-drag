  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* disable horz and vert window scrolling */
    body {
      overflow: hidden;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    /* Keeps body's background on body, so the fade-to-black below fades it too */
    html {
      background: black;
    }

    body {
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 50px;
    }

    /* The dusty backdrop, on its own layer so it can fade in after the sky */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('bg-2.webp') center / cover;
    }

    .logo {
      width: 100%;
      max-width: 1100px;
      height: 0;
      padding-bottom: 29%;
      position: relative;
      /* overflow: hidden; */
    }

    @media (min-width: 1200px) {
      .logo {
        padding-bottom: 19%;
      }
    }

    .mask-container {
      mask: url('the-universe-is-ours.svg') no-repeat center;
      -webkit-mask: url('the-universe-is-ours.svg') no-repeat center;
      mask-size: contain;
      -webkit-mask-size: contain;
      width: 90%;
      max-width: 1200px;
      height: auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 50%;
      transform: translate(-50%, -50%);
      /* The mask already hides the spinning image outside the letters; this keeps its
         corners from widening the page, which let phones scroll sideways and push the
         fixed arrows off-screen */
      overflow: hidden;
    }

    .mask-container img.universe {
      width: 100%;
      height: 100%;
      animation: rotateAndScale 100s infinite linear;
    }
    @media (min-width: 1024px) {
      .mask-container img.universe {
        animation-duration: 200s;
      }
    }

    /* The band name, small, top center: the sky's colors in the old logo */
    .band {
      position: fixed;
      top: calc(clamp(18px, 3vw, 36px) + env(safe-area-inset-top));
      left: 50%;
      z-index: 1;
      width: clamp(120px, 14vw, 190px);
      aspect-ratio: 426.4 / 180.4;
      transform: translateX(-50%);
      background: url('text-bg-2.webp') center / 400%;
      mask: url('batter-the-drag.svg') no-repeat center / contain;
      -webkit-mask: url('batter-the-drag.svg') no-repeat center / contain;
    }

    /* Bottom-left: the EP, its songs, Bandcamp, socials */
    .info {
      position: fixed;
      left: clamp(20px, 5vw, 80px);
      bottom: clamp(20px, 5vw, 80px);
      z-index: 1;
      display: grid;
      gap: 20px;
      max-width: min(460px, calc(100vw - 40px));
      font-family: 'Arial', sans-serif;
    }

    .eyebrow {
      color: #808492;
      font-size: 15px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .tracks {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: #c9d3e3;
      font-size: 15px;
    }

    .tracks button {
      all: unset;
      cursor: pointer;
      transition: color 0.3s;
    }

    .tracks button:hover,
    .tracks button[aria-current="true"] {
      color: #6693C8;
    }

    .tracks button:focus-visible {
      outline: 1px solid #6693C8;
      outline-offset: 4px;
    }

    .tracks span {
      margin-right: 5px;
      color: #808492;
      font-size: 15px;
    }

    .listen {
      justify-self: start;
      padding: 12px 22px;
      border: 1px solid #6693C8;
      border-radius: 30px;
      color: #6693C8;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.3s;
    }

    .listen:hover {
      background: #6693C8;
      color: #0b0d14;
    }

    /* Listen: (this release elsewhere) and Follow: (the band), a row each */
    .social-media-container {
      display: grid;
      gap: 12px;
    }

    .social-media {
      display: flex;
      align-items: center;
    }

    .social-label {
      min-width: 6.6em; /* lines up the two rows of icons */
      font-size: 13px;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: #808492;
    }

    .social-media a {
      margin-right: 14px;
      transition: transform 0.2s;
    }

    .social-media a:hover {
      transform: scale(1.1);
    }

    .social-media svg {
      width: 34px;
      height: 34px;
      fill: #6693C8;
      transition: fill 0.2s;
    }

    .social-media a:hover svg {
      fill: #347ed3;
    }

     @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes rotateAndScale {
      0% {
        transform: rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) scale(1.6);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    @keyframes slideUp {
      0% {
        transform: translateY(240px);
        opacity: 0;
      }
      80% {
        transform: translateY(240px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0.5;
      }
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      /* top: 50%; */
      /* left: 50%; */
      z-index: -1;
      /* transform: translate(-50%, -50%); */
      /* max-width: 85vw; */
      /* max-height: 85vw; */
    }
    /* Big prev/next arrows (placed by arrows.css) */
    .arrow,
    .discog {
      --streak: #a9c8ee;
      z-index: 2;
      color: #6693C8;
      font-family: 'Arial', sans-serif;
      transition: color 0.3s;
    }

    .arrow svg {
      stroke-width: 1.5;
      transition: transform 0.3s;
    }


    .arrow:hover,
    .discog:hover,
    .arrow:focus-visible,
    .discog:focus-visible {
      color: #fff;
    }

    .arrow:hover svg,
    .arrow:focus-visible svg {
      transform: translateX(-8px);
    }

    .arrow[data-next]:hover svg,
    .arrow[data-next]:focus-visible svg {
      transform: translateX(8px);
    }

    /* Player: Human Adjacent */
    .player {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 260px;
      padding: 8px 16px 8px 8px;
      border-radius: 32px;
      background: rgba(10, 12, 20, 0.6);
      border: 1px solid rgba(102, 147, 200, 0.35);
      font-family: 'Arial', sans-serif;
    }

    .player-toggle {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #6693C8;
      color: #0b0d14;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .player-toggle:hover {
      background: #fff;
      transform: scale(1.06);
    }

    .player-toggle svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .player-toggle .i-pause,
    .player.is-playing .player-toggle .i-play {
      display: none;
    }

    .player.is-playing .player-toggle .i-pause {
      display: block;
    }

    .player-meta {
      flex: 1;
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .player-title {
      color: #c9d3e3;
      font-size: 15px;
    }

    .player-progress {
      height: 2px;
      border-radius: 2px;
      background: rgba(102, 147, 200, 0.25);
      overflow: hidden;
    }

    .player-progress span {
      display: block;
      height: 100%;
      background: #6693C8;
      transform-origin: left;
      transform: scaleX(var(--progress, 0));
    }

    /* Short screens: lift the logo so it clears the songs in the bottom-left */
    @media (min-width: 700px) and (max-height: 800px) {
      body {
        justify-content: flex-start;
        padding-top: 5vh;
      }

      .logo {
        max-width: min(1100px, 100vh);
      }

    }

    @media (max-width: 699px) {
      /* The arrows above the songs, not over them */
      :root { --arrow-top: 46%; }

      /* Title, kind and year on one line */
      .eyebrow { letter-spacing: .12em; }

      body {
        justify-content: flex-start;
        padding-top: max(110px, 14vh);
      }

      .player {
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        width: auto;
      }

      .info {
        left: 16px;
        bottom: calc(84px + env(safe-area-inset-bottom));
        gap: 16px;
      }

      .tracks {
        font-size: 15px;
      }

      .social-media svg {
        width: 30px;
        height: 30px;
      }

    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Full-screen spinning sky: the page opens on it, then it pulls back into the letters */
    .sky {
      position: fixed;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      visibility: hidden;
    }

    /* Big enough that the spin never shows a corner */
    .sky img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150vmax;
      height: 150vmax;
      margin: -75vmax 0 0 -75vmax;
    }

    @media (prefers-reduced-motion: no-preference) {
      .sky { animation: skyIn 3.8s linear both; }
      .sky img { animation: spin 50s linear infinite; }
      .mask-container img.universe { animation-name: fadeIn, rotateAndScale; animation-duration: 1.8s, 100s; animation-delay: 1.8s, 0s; animation-fill-mode: both, none; animation-timing-function: ease-in-out, linear; animation-iteration-count: 1, infinite; }
      body::before { animation: fadeIn 1.6s 3.2s ease both; }
      .band, .info { animation: fadeIn 1.6s 3.4s ease both; }
      .arrow,
      .discog { animation: fadeIn 1.6s 3.6s ease both; }
      .arrow[data-next] { animation-delay: 3.8s; }
      .discog { animation-delay: 4s; }
      .player { animation: fadeIn 1.6s 3.8s ease both; }

      /* Leaving: everything else goes, the sky floods back in, then black */
      .is-leaving .sky { animation: skyOut 1.3s ease-in-out both; }
      .is-leaving .logo { opacity: 0; transition: opacity .5s .3s; }
      .is-leaving::before,
      .is-leaving :is(.band, .info, .arrow, .discog, .player) { animation: fadeOut .45s ease-in both; }
    }

    @media (prefers-reduced-motion: no-preference) and (min-width: 1024px) {
      .mask-container img.universe { animation-duration: 1.8s, 200s; }
    }

    /* The sky comes up quickly, then starts fading at once, across the rest of the entrance */
    @keyframes skyIn {
      0% { opacity: 0; visibility: visible; transform: scale(1.12); animation-timing-function: ease-out; }
      12% { opacity: 1; transform: scale(1.105); animation-timing-function: cubic-bezier(.3, .1, .5, 1); }
      100% { opacity: 0; visibility: hidden; transform: scale(1); }
    }

    @keyframes skyOut {
      0% { opacity: 0; visibility: visible; transform: scale(1); }
      50% { opacity: 1; }
      100% { opacity: 0; visibility: visible; transform: scale(1.12); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeOut {
      to { opacity: 0; }
    }
  </style>
</head>

  <script>
    (function () {
      var music = BTD.createPlayer({
        player: document.querySelector('.player'),
        tracks: [
          { title: 'Brutal Future', src: 'audio/brutal-future.mp3' },
          { title: 'Ghost Parasite', src: 'audio/ghost-parasite.mp3' },
          { title: 'Frozen Shoulder', src: 'audio/frozen-shoulder.mp3' },
          { title: 'Human Adjacent', src: 'audio/human-adjacent.mp3' },
          { title: 'Outsourced Thought', src: 'audio/outsourced-thought.mp3' }
        ],
        start: 3, // Human Adjacent
        resumeKey: 'btd-universe'
      });

      // Music was on on the page before: fade Human Adjacent in with the page.
      if (BTD.recall('btd-sound') === 'on') music.play(3000);

      var nav = BTD.nav({
        prev: document.querySelector('[data-prev]'),
        next: document.querySelector('[data-next]'),
        leave: function () {
          music.leave(1200);
          document.body.classList.add('is-leaving');
          return 1300;
        },
        // Back button restores this page faded out; bring it back.
        restore: function () {
          document.body.classList.remove('is-leaving');
          music.restore(2000);
        }
      });
      nav.hint();
    })();
  </script>
  <script>
  (function () {
    const mobileConfig = {
        sizeRange: [0.8, 2.3],
        speedRange: [0.1, 0.4],
        opacityRange: [0.1, 0.4],
        particleCount: 100
    };

    const desktopConfig = {
        sizeRange: [1, 3],
        speedRange: [0.2, 0.6],
        opacityRange: [0.1, 0.4],
        particleCount: 200
    };

    // Swapped in by site.js, the page is already loaded
    function onMount(callback) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', callback);
        else callback();
    }

    onMount(function () {
        const isMobile = window.innerWidth <= 768;
        const particleConfig = isMobile ? mobileConfig : desktopConfig;

        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];

        function Particle(x, y, size, speed, directionAngle, finalOpacity) {
            this.x = x;
            this.y = y;
            this.size = size;
            this.speed = speed;
            this.directionX = Math.cos(directionAngle) * speed;
            this.directionY = Math.sin(directionAngle) * speed;
            this.finalOpacity = finalOpacity;
            this.opacity = 0;

            this.update = function () {
                this.x += this.directionX;
                this.y += this.directionY;
                this.fadeIn();
            };

            this.fadeIn = function () {
                if (this.opacity < this.finalOpacity) {
                    this.opacity += 0.005;
                }
            };

            this.draw = function () {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            };
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < particleConfig.particleCount; i++) {
                let x = Math.random() * canvas.width;
                let y = Math.random() * canvas.height;
                let size = Math.random() * (particleConfig.sizeRange[1] - particleConfig.sizeRange[0]) + particleConfig.sizeRange[0];
                let speed = Math.random() * (particleConfig.speedRange[1] - particleConfig.speedRange[0]) + particleConfig.speedRange[0];
                let directionAngle = Math.floor(Math.random() * 360);
                let opacity = Math.random() * (particleConfig.opacityRange[1] - particleConfig.opacityRange[0]) + particleConfig.opacityRange[0];
                particlesArray.push(new Particle(x, y, size, speed, directionAngle, opacity));
            }
        }

        init();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        // Get the query parameters from the current URL
        const params = new URLSearchParams(window.location.search);

        // If the 'p' parameter is '1', run the animate function
        if (params.get('p') === '1') {
            animate();
        }
    });
  })();
  </script>
</body>
