<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batter The Drag · Discography</title>
  <meta name="description" content="Every Batter The Drag release: The Wendt, Ensete, The Universe Is Ours, The Big Sleep and Unfathomable Depths.">
  <meta property="og:title" content="Batter The Drag · Discography">
  <meta property="og:description" content="Every Batter The Drag release.">
  <meta property="og:image" content="https://batterthedrag.com/wendt/cover.jpg">
  <link rel="icon" type="image/png" href="favicon.png">
  <script>try { var a = sessionStorage.getItem('btd-arrive'); if (a) { sessionStorage.removeItem('btd-arrive'); document.documentElement.dataset.arrive = a; } } catch (e) {}</script>
  <script src="site.js"></script>
  <script src="timing.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --ink: #ecebe6;
      --ink-soft: #8d8b85;
      --line: rgba(236, 235, 230, .14);
      --ease-out: cubic-bezier(.2, .7, .2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Archivo', 'Arial', sans-serif;
      padding: calc(clamp(28px, 5vw, 64px) + env(safe-area-inset-top)) clamp(16px, 5vw, 64px) calc(48px + env(safe-area-inset-bottom));
    }

    header {
      display: grid;
      justify-items: center;
      gap: 18px;
      margin-bottom: clamp(32px, 6vw, 64px);
    }

    /* The band logo, in the page's ink */
    .band {
      width: clamp(150px, 20vw, 240px);
      aspect-ratio: 426.4 / 180.4;
      background: var(--ink);
      mask: url('batter-the-drag.svg') no-repeat center / contain;
      -webkit-mask: url('batter-the-drag.svg') no-repeat center / contain;
    }

    h2 {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding-left: .4em; /* balances the trailing letter-spacing */
    }

    .releases {
      width: 100%;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(16px, 2.4vw, 32px);
      max-width: 1240px;
      margin: 0 auto;
    }

    .release a {
      display: grid;
      gap: 14px;
      color: inherit;
      text-decoration: none;
      outline: none;
    }

    .cover {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background: #000;
      box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .9);
      transition: transform .5s var(--ease-out), box-shadow .5s var(--ease-out);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* The Universe Is Ours has no square cover: its spinning sky in its own lettering */
    .cover-universe {
      background: url('bg-2.webp') center / cover;
    }

    .cover-universe::before {
      content: '';
      position: absolute;
      inset: 8%;
      background: url('text-bg-2.webp') center / 160%;
      mask: url('the-universe-is-ours.svg') no-repeat center / contain;
      -webkit-mask: url('the-universe-is-ours.svg') no-repeat center / contain;
    }

    .release a:hover .cover,
    .release a:focus-visible .cover {
      transform: translateY(-6px);
      box-shadow: 0 28px 50px -20px rgba(0, 0, 0, 1);
    }

    .release a:focus-visible .cover { outline: 2px solid var(--ink); outline-offset: 4px; }

    .meta {
      display: grid;
      gap: 4px;
    }

    .title {
      font-size: clamp(15px, 1.25vw, 16px);
      font-weight: 600;
      font-stretch: 112%;
      letter-spacing: .02em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .kind {
      font-size: 15px;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    footer {
      margin-top: clamp(40px, 7vw, 80px);
      text-align: center;
    }

    footer a {
      font-size: 15px;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px;
      transition: color .3s, border-color .3s;
    }

    footer a:hover,
    footer a:focus-visible { color: var(--ink); border-color: var(--ink); }

    /* Tablets: a row of three, then two */
    @media (max-width: 999px) {
      .releases { grid-template-columns: repeat(6, 1fr); }
      .release { grid-column: span 2; }
      .release:nth-child(4) { grid-column: 2 / span 2; }
    }

    /* Phones: the newest big, the rest in pairs */
    @media (max-width: 599px) {
      .releases { grid-template-columns: 1fr 1fr; }
      .release,
      .release:nth-child(4) { grid-column: auto; }
      .release:first-child { grid-column: 1 / -1; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Black (or the Wendt's light, coming from it) that lifts on arrival and falls on leaving */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background: var(--bg);
      opacity: 0;
    }

    [data-arrive="light"] .veil { background: #f3ead2; }

    @media (prefers-reduced-motion: no-preference) {
      .veil { animation: lift .9s ease both; }
      header { animation: rise 1s .3s var(--ease-out) both; }
      .release { animation: rise 1s calc(.45s + var(--i) * .09s) var(--ease-out) both; }
      footer { animation: rise 1s 1s var(--ease-out) both; }

      /* Leaving: the others sink away, the chosen cover comes forward, then black */
      .is-leaving .veil { background: var(--bg); animation: fall .5s .35s ease-in both; }
      .is-leaving :is(header, footer, .release:not(.is-chosen)) { animation: sink .45s ease-in both; }
      .is-leaving .is-chosen .cover { transform: scale(1.08); transition-duration: .8s; }
    }

    @keyframes lift { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fall { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    @keyframes sink { to { opacity: 0; transform: translateY(12px); } }
  </style>
</head>
<body>
  <header>
    <h1 class="band"><span class="sr-only">Batter The Drag</span></h1>
    <h2>Discography</h2>
  </header>

  <ol class="releases">
    <li class="release" style="--i: 0">
      <a href="./">
        <span class="cover"><img src="wendt/cover-sm.webp" alt="" width="600" height="600"></span>
        <span class="meta"><span class="title">The Wendt</span><span class="kind">LP · 2026</span></span>
      </a>
    </li>
    <li class="release" style="--i: 1">
      <a href="ensete">
        <span class="cover"><img src="ensete/cover-sm.webp" alt="" width="600" height="600"></span>
        <span class="meta"><span class="title">Ensete</span><span class="kind">Single · 2025</span></span>
      </a>
    </li>
    <li class="release" style="--i: 2">
      <a href="the-universe-is-ours">
        <span class="cover cover-universe"></span>
        <span class="meta"><span class="title">The Universe Is Ours</span><span class="kind">EP · 2024</span></span>
      </a>
    </li>
    <li class="release" style="--i: 3">
      <a href="the-big-sleep">
        <span class="cover"><img src="the-big-sleep/cover-sm.webp" alt="" width="600" height="600"></span>
        <span class="meta"><span class="title">The Big Sleep</span><span class="kind">LP · 2005</span></span>
      </a>
    </li>
    <li class="release" style="--i: 4">
      <a href="unfathomable-depths">
        <span class="cover"><img src="unfathomable-depths/cover-sm.webp" alt="" width="600" height="600"></span>
        <span class="meta"><span class="title">Unfathomable Depths</span><span class="kind">EP · 2004</span></span>
      </a>
    </li>
  </ol>

  <footer>
    <a href="https://batterthedrag.bandcamp.com" target="_blank" rel="noopener">Everything on Bandcamp</a>
  </footer>

  <div class="veil" aria-hidden="true"></div>

  <script src="cursor.js"></script>
  <script>BTD.cursor('ring');</script>
  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var timer;

      var links = document.querySelectorAll('.release a');

      // site.js swaps the release in; without it, an ordinary page load
      function arrive(href) {
        if (BTD.site) BTD.site.go(href);
        else location.href = href;
      }

      function leave(link) {
        if (BTD.site) BTD.site.prefetch(link.href);
        if (reduceMotion) { arrive(link.href); return; }
        link.parentNode.classList.add('is-chosen');
        document.body.classList.add('is-leaving');
        timer = setTimeout(function () { arrive(link.href); }, 900 / BTD.timing.exit);
      }

      links.forEach(function (link) {
        link.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
          e.preventDefault();
          if (!document.body.classList.contains('is-leaving')) leave(link);
        });
      });

      // The browser's Back / Forward to a release leaves the same way
      if (BTD.site) BTD.site.onBack(function (path) {
        var link = [].filter.call(links, function (l) { return BTD.site.pathOf(l.href) === path; })[0];
        if (!link || document.body.classList.contains('is-leaving')) return false;
        leave(link);
        return true;
      });

      // The back button brings the page back mid-exit: undo it.
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        clearTimeout(timer);
        document.body.classList.remove('is-leaving');
        var chosen = document.querySelector('.is-chosen');
        if (chosen) chosen.classList.remove('is-chosen');
      });
    })();
  </script>
</body>
</html>
